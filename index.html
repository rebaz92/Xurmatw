<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REBAZ TV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
        .channel-item:hover { background-color: #1e293b; cursor: pointer; }
        .active-channel { background-color: #2563eb !important; color: #fff; }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- Sidebar / Channel List -->
    <div class="w-full md:w-1/3 lg:w-1/4 bg-slate-900 border-l border-slate-800 flex flex-col h-1/2 md:h-full">
        <!-- Header & Logo Image -->
        <div class="p-3 bg-slate-950 border-b border-slate-800 flex items-center space-x-3 space-x-reverse">
            <img src="1000100682.png" alt="REBAZ TV" class="w-10 h-10 rounded-lg object-cover border border-slate-700">
            <div>
                <h1 class="text-lg font-bold tracking-wider text-blue-500">REBAZ TV</h1>
                <span class="text-[10px] bg-blue-600 text-white px-2 py-0.5 rounded">LIVE</span>
            </div>
        </div>
        
        <!-- Search Box -->
        <div class="p-2 bg-slate-900">
            <input type="text" id="searchInput" onkeyup="filterChannels()" placeholder="گەڕان بۆ کەناڵ..." 
                   class="w-full p-2 bg-slate-800 text-sm text-white rounded border border-slate-700 focus:outline-none focus:border-blue-500">
        </div>

        <!-- Channels Container -->
        <div id="channelList" class="flex-1 overflow-y-auto p-2 space-y-1">
            <p class="text-center text-slate-400 p-4">داتای کەناڵەکان بار دەکرێت...</p>
        </div>
    </div>

    <!-- Main Video Player Section -->
    <div class="flex-1 bg-black flex flex-col justify-center items-center relative h-1/2 md:h-full">
        <video id="videoPlayer" class="w-full h-full object-contain" controls autoplay></video>
        <div id="channelTitle" class="absolute top-4 left-4 bg-black/60 px-3 py-1 rounded text-sm text-white backdrop-blur">
            پەخشی ڕاستەوخۆ - REBAZ TV
        </div>
    </div>

    <script>
        const M3U_URL = 'https://raw.githubusercontent.com/rebaz92/Xurmatw/refs/heads/main/xurmatw';
        let allChannels = [];

        async function loadPlaylist() {
            try {
                const response = await fetch(M3U_URL);
                const data = await response.text();
                parseM3U(data);
            } catch (error) {
                document.getElementById('channelList').innerHTML = '<p class="text-red-500 text-center p-4">کێشەیەک لە بارکردنی کەناڵەکان ڕوویدا.</p>';
            }
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            allChannels = [];
            let currentChannel = null;

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const nameMatch = line.match(/,(.+)$/);
                    const name = nameMatch ? nameMatch[1] : 'کەناڵ';
                    currentChannel = { name: name };
                } else if (line && !line.startsWith('#')) {
                    if (currentChannel) {
                        currentChannel.url = line;
                        allChannels.push(currentChannel);
                        currentChannel = null;
                    }
                }
            });

            renderChannels(allChannels);
            if (allChannels.length > 0) {
                playChannel(allChannels[0].url, allChannels[0].name);
            }
        }

        function renderChannels(channels) {
            const listDiv = document.getElementById('channelList');
            listDiv.innerHTML = '';
            channels.forEach((ch, index) => {
                const item = document.createElement('div');
                item.className = `channel-item p-3 rounded transition flex items-center justify-between text-sm ${index === 0 ? 'active-channel' : ''}`;
                item.innerHTML = `<span>${ch.name}</span> <span class="text-xs text-slate-400">►</span>`;
                item.onclick = () => {
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active-channel'));
                    item.classList.add('active-channel');
                    playChannel(ch.url, ch.name);
                };
                listDiv.appendChild(item);
            });
        }

        function playChannel(url, name) {
            const video = document.getElementById('videoPlayer');
            document.getElementById('channelTitle').innerText = name;

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play();
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play();
            }
        }

        function filterChannels() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(query));
            renderChannels(filtered);
        }

        loadPlaylist();
    </script>
</body>
</html>
