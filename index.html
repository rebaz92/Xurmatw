<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REBAZ TV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
        .channel-item:hover { background-color: #1e293b; cursor: pointer; }
        .active-channel { background-color: #2563eb !important; color: #fff; }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- Sidebar / Channel List -->
    <div class="w-full md:w-1/3 lg:w-1/4 bg-slate-900 border-l border-slate-800 flex flex-col h-1/2 md:h-full">
        <!-- Header & Logo Image -->
        <div class="p-3 bg-slate-950 border-b border-slate-800 flex items-center space-x-3 space-x-reverse">
            <img src="1000100682.png" alt="REBAZ TV" onerror="this.style.display='none'" class="w-10 h-10 rounded-lg object-cover border border-slate-700">
            <div>
                <h1 class="text-lg font-bold tracking-wider text-blue-500">REBAZ TV</h1>
                <span class="text-[10px] bg-blue-600 text-white px-2 py-0.5 rounded">LIVE</span>
            </div>
        </div>

        <!-- Search Box -->
        <div class="p-2 bg-slate-900">
            <input type="text" id="searchInput" onkeyup="filterChannels()" placeholder="گەڕان بۆ کەناڵ..." class="w-full p-2 bg-slate-800 text-sm text-white rounded border border-slate-700 focus:outline-none focus:border-blue-500">
        </div>

        <!-- Channels Container -->
        <div id="channelList" class="flex-1 overflow-y-auto divide-y divide-slate-800/50">
            <div class="p-4 text-center text-slate-400 text-sm">چاوەڕوانبە، کەناڵەکان باردەکرێن...</div>
        </div>
    </div>

    <!-- Main Player Area -->
    <div class="flex-1 bg-slate-950 flex flex-col h-1/2 md:h-full relative">
        <div class="flex-1 flex items-center justify-center relative bg-black">
            <video id="videoPlayer" controls autoplay class="w-full h-full max-h-screen"></video>
            <div id="loadingIndicator" class="absolute inset-0 flex items-center justify-center bg-black/70 text-blue-400 font-bold text-lg hidden">
                <span>تکایە چاوەڕوانبە، کەناڵەکە دەکرێتەوە...</span>
            </div>
        </div>
    </div>

    <script>
        const m3uUrl = 'https://raw.githubusercontent.com/rebaz92/Xurmatw/refs/heads/main/xurmatw';
        let allChannels = [];
        let hls = null;

        async function loadPlaylist() {
            try {
                const response = await fetch(m3uUrl);
                const data = await response.text();
                parseM3U(data);
            } catch (error) {
                console.error('Error loading M3U:', error);
                document.getElementById('channelList').innerHTML = '<div class="p-4 text-center text-red-400 text-sm">هەڵە لە بارکردنی کەناڵەکان ڕوویدا.</div>';
            }
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            allChannels = [];
            let currentChannel = {};

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    currentChannel = {};
                    let tvgNameMatch = line.match(/tvg-name="([^"]*)"/);
                    let logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    let titleSplit = line.split(',');

                    currentChannel.name = titleSplit.length > 1 ? titleSplit[titleSplit.length - 1].trim() : 'Unknown Channel';
                    currentChannel.logo = logoMatch ? logoMatch[1] : '';
                } else if (line && !line.startsWith('#')) {
                    currentChannel.url = line;
                    if (currentChannel.name && currentChannel.url) {
                        allChannels.push(currentChannel);
                    }
                }
            }
            displayChannels(allChannels);
            if (allChannels.length > 0) {
                playChannel(allChannels[0].url, 0);
            }
        }

        function displayChannels(channels) {
            const container = document.getElementById('channelList');
            container.innerHTML = '';
            
            if (channels.length === 0) {
                container.innerHTML = '<div class="p-4 text-center text-slate-400 text-sm">هیچ کەناڵێک نەدۆزراوەوە</div>';
                return;
            }

            channels.forEach((channel, index) => {
                const div = document.createElement('div');
                div.className = `channel-item p-3 flex items-center space-x-3 space-x-reverse transition-colors ${index === 0 ? 'active-channel' : ''}`;
                div.onclick = () => {
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active-channel'));
                    div.classList.add('active-channel');
                    playChannel(channel.url, index);
                };

                div.innerHTML = `
                    <div class="w-8 h-8 bg-slate-800 rounded flex items-center justify-center text-xs font-bold text-slate-300 overflow-hidden border border-slate-700">
                        ${channel.logo ? `<img src="${channel.logo}" class="w-full h-full object-cover" onerror="this.parentElement.innerText='TV'">` : 'TV'}
                    </div>
                    <div class="flex-1 truncate text-sm font-medium">${channel.name}</div>
                `;
                container.appendChild(div);
            });
        }

        function filterChannels() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allChannels.filter(c => c.name.toLowerCase().includes(query));
            displayChannels(filtered);
        }

        function playChannel(url, index) {
            const video = document.getElementById('videoPlayer');
            const loading = document.getElementById('loadingIndicator');
            loading.classList.remove('hidden');

            if (hls) {
                hls.destroy();
                hls = null;
            }

            if (url.includes('.m3u8') || url.includes('ts') || Hls.isSupported()) {
                if (Hls.isSupported()) {
                    hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play();
                        loading.classList.add('hidden');
                    });
                    hls.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            loading.classList.add('hidden');
                        }
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.addEventListener('loadedmetadata', () => {
                        video.play();
                        loading.classList.add('hidden');
                    });
                }
            } else {
                video.src = url;
                video.play();
                loading.classList.add('hidden');
            }
        }

        loadPlaylist();
    </script>
</body>
</html>
